search = ``` This search must be run on the Monitoring Console instance in a distributed environment. ```\
``` It takes approximately 0.2 seconds per sourcetype. For example, if you have 1,000 sourcetypes, the total processing time will be around 200 seconds. ``` \
``` Download the results as a CSV file. ```\
index=_internal source=*license_usage.log* type=Usage `dsi_set_period_for_stats_by_index_sourcetype`\
| bin _time span=1d \
| stats sum(b) as b values(licensed_weight) as licensed_weight by _time idx st \
| eval day_type = if(in(strftime(_time,"%a"), "Sat", "Sun"), "weekend", "weekday") \
| eventstats avg(b) as day_type_b by day_type idx st \
| eval {day_type}_b = day_type_b \
| stats count(eval(b>0)) as ingesting_days sum(b) as bytes avg(b) as b_ingesting_day_avg max(b) as b_max avg(weekday_b) as weekday_b_ingesting_day_avg avg(weekend_b) as weekend_b_ingesting_day_avg values(licensed_weight) as licensed_weight by idx st \
| addinfo \
| eval period_days = round((info_max_time - info_min_time) / 86400) \
| eval b_period_day_avg = bytes / period_days \
| fields idx st period_days ingesting_days bytes b_period_day_avg b_ingesting_day_avg b_max weekday_b_ingesting_day_avg weekend_b_ingesting_day_avg licensed_weight \
| append \
    [ tstats count where index=* `dsi_set_period_for_stats_by_index_sourcetype` by index sourcetype \
    | rename index as idx, sourcetype as st \
    | rename count as events ] \
| stats values(*) as * by idx st \
| fields idx st period_days ingesting_days events bytes b_period_day_avg b_ingesting_day_avg b_max weekday_b_ingesting_day_avg weekend_b_ingesting_day_avg licensed_weight \
| join type=left idx \
    [ rest /services/admin/indexes \
    | rename title as idx \
    | fields splunk_server idx remotePath maxDataSize frozenTimePeriodInSecs maxGlobalDataSizeMB maxTotalDataSizeMB maxWarmDBCount homePath.maxDataSizeMB coldPath.maxDataSizeMB archiver.enableDataArchive archiver.maxDataArchiveRetentionPeriod archive.selfStorageBucketFolder \
    | stats mode(*) as * by idx \
    | fields idx remotePath maxDataSize frozenTimePeriodInSecs maxGlobalDataSizeMB maxTotalDataSizeMB maxWarmDBCount homePath.maxDataSizeMB coldPath.maxDataSizeMB archiver.enableDataArchive archiver.maxDataArchiveRetentionPeriod archive.selfStorageBucketFolder ] \
| rename idx as index, st as sourcetype\
| fields index sourcetype period_days ingesting_days events bytes b_period_day_avg b_ingesting_day_avg b_max weekday_b_ingesting_day_avg weekend_b_ingesting_day_avg licensed_weight remotePath maxDataSize frozenTimePeriodInSecs maxGlobalDataSizeMB maxTotalDataSizeMB maxWarmDBCount homePath.maxDataSizeMB coldPath.maxDataSizeMB archiver.enableDataArchive archiver.maxDataArchiveRetentionPeriod archive.selfStorageBucketFolder

