| `dsi_resolve_referenced_indexes_and_sourcetypes_by_eventtype`\
| `dsi_expand_reference(referenced_indexes, referenced_indexes_by_eventtype)`\
| `dsi_expand_reference(excluded_indexes, excluded_indexes_by_eventtype)`\
