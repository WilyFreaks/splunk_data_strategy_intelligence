)\
\
| eval result=if(\
    referenced_indexes_check="OK"\
    AND excluded_indexes_check="OK"\
    AND referenced_sourcetypes_check="OK"\
    AND excluded_sourcetypes_check="OK"\
    AND original_fields_check="OK"\
    AND output_format_check="OK",\
