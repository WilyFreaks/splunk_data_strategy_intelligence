[dsi_test_referenced_indexes]
action.email.useNSSubject = 1
action.ssg_mobile_alert.passSystemAuth = 1
action.webhook.enable_allowlist = 1
alert.digest_mode = 1
alert.track = 0
auto_summarize = 0
disabled = 0
dispatch.allow_partial_results = 1
dispatch.earliest_time = -30m@m
dispatch.latest_time = now
dispatch.lookups = 1
dispatch.rt_backfill = 0
dispatch.spawn_process = 1
display.general.type = statistics
display.page.search.tab = statistics
display.visualizations.show = 0
enableSched = 0
is_visible = 1
realtime_schedule = 1
request.ui_dispatch_app = splunk_data_strategy_intelligence
request.ui_dispatch_view = search
restart_on_searchpeer_add = 1
run_on_startup = 0
search = | makeresults count=65\
| streamstats count as case_id\
\
| eval bt=printf("%c",96)\
| eval c3=bt.bt.bt\
| eval nl=printf("%c",10)\
\
| eval test_category=case(\
    case_id<=12, "Positive Index",\
    case_id<=18, "Negative Index",\
    case_id<=24, "Negative Group",\
    case_id<=29, "SPL2 From",\
    case_id<=34, "Positive Macro",\
    case_id<=39, "Negative Macro",\
    case_id<=44, "Literal Exclusion",\
    case_id<=47, "Flat Macro Exclusion",\
    case_id<=50, "Eventtype Exclusion",\
    case_id<=55, "Comment Exclusion",\
    case_id<=58, "Datamodel Exclusion",\
    case_id<=65, "Eval Exclusion"\
)\
\
| eval test_case=case(\
    case_id=1,  "01: index=main",\
    case_id=2,  "02: spaces around equals",\
    case_id=3,  "03: quoted index",\
    case_id=4,  "04: wildcard index",\
    case_id=5,  "05: federated index",\
    case_id=6,  "06: two index clauses",\
    case_id=7,  "07: index IN",\
    case_id=8,  "08: quoted values in index IN",\
    case_id=9,  "09: internal index",\
    case_id=10, "10: index with sourcetype",\
    case_id=11, "11: search index",\
    case_id=12, "12: uppercase INDEX",\
\
    case_id=13, "13: NOT index",\
    case_id=14, "14: index!=",\
    case_id=15, "15: NOT index IN",\
    case_id=16, "16: positive and NOT index",\
    case_id=17, "17: quoted NOT index",\
    case_id=18, "18: wildcard negative index",\
\
    case_id=19, "19: NOT group single index",\
    case_id=20, "20: NOT group two indexes",\
    case_id=21, "21: positive plus NOT group",\
    case_id=22, "22: NOT group index macro",\
    case_id=23, "23: NOT group mixed fields",\
    case_id=24, "24: positive plus two negative group indexes",\
\
    case_id=25, "25: SPL2 from index",\
    case_id=26, "26: SPL2 from quoted index",\
    case_id=27, "27: SPL2 from federated index",\
    case_id=28, "28: SPL2 from wildcard index",\
    case_id=29, "29: SPL2 from with following command",\
\
    case_id=30, "30: index macro",\
    case_id=31, "31: index macro with spaces",\
    case_id=32, "32: index IN macro and literal",\
    case_id=33, "33: two index macros",\
    case_id=34, "34: SPL2 from index macro",\
\
    case_id=35, "35: NOT index macro",\
    case_id=36, "36: index!=macro",\
    case_id=37, "37: NOT index IN macro",\
    case_id=38, "38: negative macro and literal",\
    case_id=39, "39: positive macro plus negative macro",\
\
    case_id=40, "40: index expression inside literal",\
    case_id=41, "41: literal plus real index",\
    case_id=42, "42: negative expression inside literal",\
    case_id=43, "43: from expression inside literal",\
    case_id=44, "44: index IN expression inside literal",\
\
    case_id=45, "45: standalone flat macro",\
    case_id=46, "46: standalone macro with arguments",\
    case_id=47, "47: real index plus flat macro",\
\
    case_id=48, "48: eventtype only",\
    case_id=49, "49: eventtype macro only",\
    case_id=50, "50: eventtype plus real index",\
\
    case_id=51, "51: triple-backtick comment",\
    case_id=52, "52: block comment",\
    case_id=53, "53: line comment",\
    case_id=54, "54: negative index inside comment",\
    case_id=55, "55: comment marker inside literal",\
\
    case_id=56, "56: SPL2 from datamodel Authentication",\
    case_id=57, "57: SPL2 from datamodel Network_Traffic",\
    case_id=58, "58: SPL2 from datamodel Endpoint",\
\
    case_id=59, "59: eval index literal assignment",\
    case_id=60, "60: eval index assignment with spaces",\
    case_id=61, "61: real index then eval index assignment",\
    case_id=62, "62: eval index with if",\
    case_id=63, "63: eval index with coalesce",\
    case_id=64, "64: eval index with case",\
    case_id=65, "65: eval field containing index expression"\
)\
\
| eval search=case(\
    case_id=1,  "index=main",\
    case_id=2,  "index = main",\
    case_id=3,  "index=\"main\"",\
    case_id=4,  "index=web-*",\
    case_id=5,  "index=federated:remote_index",\
    case_id=6,  "index=main OR index=security",\
    case_id=7,  "index IN (main,security)",\
    case_id=8,  "index IN (\"main\",\"security\")",\
    case_id=9,  "index=_internal",\
    case_id=10, "index=main sourcetype=syslog",\
    case_id=11, "search index=main",\
    case_id=12, "INDEX=main",\
\
    case_id=13, "NOT index=main",\
    case_id=14, "index!=main",\
    case_id=15, "NOT index IN (main,security)",\
    case_id=16, "index=main NOT index=security",\
    case_id=17, "NOT index=\"main\"",\
    case_id=18, "NOT index=web-*",\
\
    case_id=19, "NOT (index=main)",\
    case_id=20, "NOT (index=main OR index=security)",\
    case_id=21, "index=main NOT (index=security)",\
    case_id=22, "NOT (index=".bt."index_internal".bt.")",\
    case_id=23, "NOT (index=main OR sourcetype=syslog)",\
    case_id=24, "index=main NOT (index=security OR index=_internal)",\
\
    case_id=25, "| from main",\
    case_id=26, "| from \"main\"",\
    case_id=27, "| from federated:remote_index",\
    case_id=28, "| from web-*",\
    case_id=29, "| from main | where status=200",\
\
    case_id=30, "index=".bt."index_main".bt,\
    case_id=31, "index = ".bt."index_main".bt,\
    case_id=32, "index IN (".bt."index_main".bt.",security)",\
    case_id=33, "index=".bt."index_main".bt." OR index=".bt."index_security".bt,\
    case_id=34, "| from ".bt."index_main".bt,\
\
    case_id=35, "NOT index=".bt."index_main".bt,\
    case_id=36, "index!=".bt."index_main".bt,\
    case_id=37, "NOT index IN (".bt."index_main".bt.",security)",\
    case_id=38, "NOT index=".bt."index_main".bt." OR index!=security",\
    case_id=39, "index=".bt."index_main".bt." NOT index=".bt."index_security".bt,\
\
    case_id=40, "\"index=secret\"",\
    case_id=41, "\"index=secret\" index=main",\
    case_id=42, "\"NOT index=secret\"",\
    case_id=43, "\"| from secret\"",\
    case_id=44, "\"index IN (secret,hidden)\"",\
\
    case_id=45, bt."flat_macro".bt,\
    case_id=46, bt."flat_macro(foo,\"bar\",123)".bt,\
    case_id=47, "index=main | ".bt."flat_macro".bt,\
\
    case_id=48, "eventtype=authentication",\
    case_id=49, "eventtype=".bt."authentication_eventtype".bt,\
    case_id=50, "eventtype=authentication index=main",\
\
    case_id=51, c3." index=secret ".c3." index=main",\
    case_id=52, "/* index=secret */ index=main",\
    case_id=53, "// index=secret".nl."index=main",\
    case_id=54, "/* NOT index=secret */ index=main",\
    case_id=55, "\"/* index=secret */\" index=main",\
\
    case_id=56, "| from datamodel:Authentication.Authentication",\
    case_id=57, "| from datamodel:Network_Traffic.All_Traffic | stats count",\
    case_id=58, "| from datamodel:Endpoint.Processes",\
\
    case_id=59, "| makeresults | eval index=\"test\"",\
    case_id=60, "| makeresults | eval index = \"test\"",\
    case_id=61, "index=main | eval index=\"test\"",\
    case_id=62, "| makeresults | eval index=if(foo=\"bar\",\"main\",\"security\")",\
    case_id=63, "| makeresults | eval index=coalesce(index,\"main\")",\
    case_id=64, "| makeresults | eval index=case(foo=1,\"main\",true(),\"security\")",\
    case_id=65, "| makeresults | eval foo=\"index=main\""\
)\
\
| eval expected_referenced_indexes=case(\
    case_id=1, "main",\
    case_id=2, "main",\
    case_id=3, "main",\
    case_id=4, "web-*",\
    case_id=5, "federated:remote_index",\
    case_id=6, "main,security",\
    case_id=7, "main,security",\
    case_id=8, "main,security",\
    case_id=9, "_internal",\
    case_id=10, "main",\
    case_id=11, "main",\
    case_id=12, "main",\
    case_id=16, "main",\
    case_id=21, "main",\
    case_id=24, "main",\
    case_id=25, "main",\
    case_id=26, "main",\
    case_id=27, "federated:remote_index",\
    case_id=28, "web-*",\
    case_id=29, "main",\
    case_id=32, "security",\
    case_id=41, "main",\
    case_id=47, "main",\
    case_id=50, "main",\
    case_id=51, "main",\
    case_id=52, "main",\
    case_id=53, "main",\
    case_id=54, "main",\
    case_id=55, "main",\
    case_id=61, "main",\
    true(), ""\
)\
\
| eval expected_referenced_index_macros=case(\
    case_id=30, "index_main",\
    case_id=31, "index_main",\
    case_id=32, "index_main",\
    case_id=33, "index_main,index_security",\
    case_id=34, "index_main",\
    case_id=39, "index_main",\
    true(), ""\
)\
\
| eval expected_excluded_indexes=case(\
    case_id=13, "main",\
    case_id=14, "main",\
    case_id=15, "main,security",\
    case_id=16, "security",\
    case_id=17, "main",\
    case_id=18, "web-*",\
    case_id=19, "main",\
    case_id=20, "main,security",\
    case_id=21, "security",\
    case_id=23, "main",\
    case_id=24, "_internal,security",\
    case_id=37, "security",\
    case_id=38, "security",\
    true(), ""\
)\
\
| eval expected_excluded_index_macros=case(\
    case_id=22, "index_internal",\
    case_id=35, "index_main",\
    case_id=36, "index_main",\
    case_id=37, "index_main",\
    case_id=38, "index_main",\
    case_id=39, "index_security",\
    true(), ""\
)\
\
| `dsi_extract_referenced_indexes(search)`\
\
| eval output_format_check=if(\
    coalesce(mvcount(referenced_indexes),0)<=1\
    AND coalesce(mvcount(referenced_index_macros),0)<=1\
    AND coalesce(mvcount(excluded_indexes),0)<=1\
    AND coalesce(mvcount(excluded_index_macros),0)<=1,\
    "OK",\
    "NG"\
)\
\
| eval referenced_indexes=split(referenced_indexes,printf("%c",10))\
| eval referenced_index_macros=split(referenced_index_macros,printf("%c",10))\
| eval excluded_indexes=split(excluded_indexes,printf("%c",10))\
| eval excluded_index_macros=split(excluded_index_macros,printf("%c",10))\
\
| eval actual_referenced_indexes=coalesce(mvjoin(mvsort(referenced_indexes),","),"")\
| eval actual_referenced_index_macros=coalesce(mvjoin(mvsort(referenced_index_macros),","),"")\
| eval actual_excluded_indexes=coalesce(mvjoin(mvsort(excluded_indexes),","),"")\
| eval actual_excluded_index_macros=coalesce(mvjoin(mvsort(excluded_index_macros),","),"")\
\
| eval referenced_indexes_check=if(actual_referenced_indexes=expected_referenced_indexes,"OK","NG")\
| eval referenced_index_macros_check=if(actual_referenced_index_macros=expected_referenced_index_macros,"OK","NG")\
| eval excluded_indexes_check=if(actual_excluded_indexes=expected_excluded_indexes,"OK","NG")\
| eval excluded_index_macros_check=if(actual_excluded_index_macros=expected_excluded_index_macros,"OK","NG")\
\
| eval result=if(\
    referenced_indexes_check="OK"\
    AND referenced_index_macros_check="OK"\
    AND excluded_indexes_check="OK"\
    AND excluded_index_macros_check="OK"\
    AND output_format_check="OK",\
    "PASS",\
    "FAIL"\
)\
\
| table\
    test_category\
    case_id\
    test_case\
    result\
    expected_referenced_indexes\
    actual_referenced_indexes\
    expected_referenced_index_macros\
    actual_referenced_index_macros\
    expected_excluded_indexes\
    actual_excluded_indexes\
    expected_excluded_index_macros\
    actual_excluded_index_macros\
    referenced_indexes_check\
    referenced_index_macros_check\
    excluded_indexes_check\
    excluded_index_macros_check\
    output_format_check\
\
| sort case_id

