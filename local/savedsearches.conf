| `dsi_extract_referenced_macros(search)`\
``` Resolve the index and sourcetype macros (index=`macro` or sourcetype=`macro`) ```\
| `dsi_resolve_referenced_object_macros(referenced_index_macros)`\
| `dsi_resolve_referenced_object_macros(excluded_index_macros)`\
| `dsi_resolve_referenced_object_macros(referenced_sourcetype_macros)`\
