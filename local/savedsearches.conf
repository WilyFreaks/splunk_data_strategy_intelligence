``` This search must be run on the Monitoring Console instance in a distributed environment. ```\
``` It takes approximately 0.04 seconds for each sourcetype. If you have 1,000 sourcetypes, it will take 200 seconds. ``` \
``` Download the results as a CSV file. ```\
| where NOT match(disabled, "(?i)1|true")\
| fields title eai:acl.app eai:acl.sharing cron_schedule dispatch.earliest_time dispatch.latest_time allow_skew action.summary_index durable.track_time_type durable.lag_time disabled search splunk_server\
| rename title as savedsearch_name eai:acl.* as *, dispatch.* as *, action.* as *, durable.* as durable_*\
| rex field=cron_schedule "^(?<cron_m>\S+)\s+(?<cron_h>\S+)\s+(?<cron_date>\S+)\s+(?<cron_month>\S+)\s+(?<cron_dow>\S+)" \
| rex field=cron_dow max_match=0 "(?<cron_dow_at>\d+)" \
| rex field=cron_month max_match=0 "(?<cron_month_at>\d+)" \
| rex field=cron_date max_match=0 "(?<cron_date_at>\d+)" \
| rex field=cron_h max_match=0 "(?<cron_h_at>\d+)" \
| rex field=cron_h "\/(?<cron_h_every>.+)" \
| rex field=cron_h "(?<cron_h_thr>\d+-\d+)" \
| rex field=cron_m max_match=0 "(?<cron_m_at>\d+)" \
| rex field=cron_m "\/(?<cron_m_every>.+)" \
| eval cron_h_at = if(match(cron_h, "^\d+-"), mvindex(cron_h_at, 0), if(cron_h = "*", 0, cron_h_at)) \
| eval cron_h_at0 = mvindex(cron_h_at,0), cron_h_at1 = mvindex(cron_h_at,1) \
| eval cron_m_at = if(match(cron_m, "^\d+-"), mvindex(cron_m_at, 0), if(cron_m = "*", 0, cron_m_at)) \
| eval cron_m_at0 = mvindex(cron_m_at,0), cron_m_at1 = mvindex(cron_m_at,1) \
| eval interval = case(isnotnull(cron_dow_at), 86400*7, isnotnull(cron_month_at), 86400*365, isnotnull(cron_date_at), 86400*28, isnotnull(cron_h_every), cron_h_every * 3600, isnotnull(cron_h_thr), 3600, mvcount(cron_h_at)>1, (cron_h_at1 - cron_h_at0) * 3600, cron_m = "*", 60, isnotnull(cron_m_every), cron_m_every * 60, isnum(cron_m) AND cron_h = "*", 3600, mvcount(cron_m_at)>1, (cron_m_at1 - cron_m_at0) * 60, isnotnull(cron_schedule), 86400)\
| stats last(*) as * by app savedsearch_name\
| fields savedsearch_name app sharing cron_schedule interval earliest_time latest_time allow_skew summary_index durable_track_time_type durable_lag_time disabled search splunk_server\
``` extract the referenced objects ```\
| `dsi_extract_referenced_indexes(search)`\
| `dsi_extract_referenced_sourcetypes(search)`\
