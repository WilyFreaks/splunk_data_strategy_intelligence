[dsi_test_referenced_eventtype]
search = (\
    index=main\
    OR index=security\
    OR index=`dsi_test_referenced_index_macro_2`\
)\
AND NOT (\
    index=_internal\
    OR index=`dsi_test_referenced_index_macro_5`\
)\
AND (\
    sourcetype=syslog\
    OR sourcetype=access_combined\
    OR sourcetype=`dsi_test_referenced_sourcetype_macro_2`\
)\
AND NOT (\
    sourcetype=noisy\
    OR sourcetype=`dsi_test_referenced_sourcetype_macro_5`\
)
