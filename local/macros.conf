    referenced_index_macros_def_org as referenced_index_macros_def\
    excluded_indexes_org as excluded_indexes\
    excluded_index_macros_org as excluded_index_macros\
    excluded_index_macros_def_org as excluded_index_macros_def\
    referenced_sourcetypes_org as referenced_sourcetypes\
    referenced_sourcetype_macros_org as referenced_sourcetype_macros\
    referenced_sourcetype_macros_def_org as referenced_sourcetype_macros_def\
    excluded_sourcetypes_org as excluded_sourcetypes\
    excluded_sourcetype_macros_org as excluded_sourcetype_macros\
    excluded_sourcetype_macros_def_org as excluded_sourcetype_macros_def\
    scanned_sourcetypes_org as scanned_sourcetypes\
\
| fields -\
    dsi_datamodel_event_id\
    dsi_datamodel_work\
    dsi_datamodel_spl\
    dsi_datamodel_base_search\
    dsi_datamodel_constraint_search\
    dsi_referenced_indexes_by_datamodel\
    dsi_referenced_sourcetypes_by_datamodel\
    dsi_excluded_indexes_by_datamodel\
    dsi_excluded_sourcetypes_by_datamodel
