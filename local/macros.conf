[dsi_extract_referenced_indexes(1)]
args = field
definition = eval index_work=$field$\
\
| eval index_work=replace(\
    index_work,\
    "(?=(?:[^\"]*\"[^\"]*\")*[^\"]*$)\x60{3}[\s\S]*?\x60{3}",\
    " "\
)\
\
| eval index_work=replace(\
    index_work,\
    "(?=(?:[^\"]*\"[^\"]*\")*[^\"]*$)/\*[\s\S]*?\*/",\
    " "\
)\
\
| eval index_work=replace(\
    index_work,\
    "(?=(?:[^\"]*\"[^\"]*\")*[^\"]*$)//[^\r\n]*",\
    " "\
)\
\
| eval index_work=replace(\
    index_work,\
    "(?i)(?:^|\|)\s*eval\b(?:[^|\"]|\"[^\"]*\")*",\
    " "\
)\
\
| rex field=index_work max_match=0 "(?i)(?=(?:[^\"]*\"[^\"]*\")*[^\"]*$)\bNOT\s*\((?<index_negative_group_work>[^()]*)\)"\
\
| eval index_negative_group_work=mvjoin(\
    index_negative_group_work,\
    " "\
)\
\
| rex field=index_negative_group_work max_match=0 "(?i)\bindex\s*=\s*\"?(?<index_negative_group>[A-Za-z0-9_.*:\-]+)\"?"\
\
| rex field=index_negative_group_work max_match=0 "(?i)\bindex\s*=\s*\x60(?<index_negative_group_macro>[A-Za-z0-9_-]+)(?:\([^\x60]*\))?\x60"\
\
| rex field=index_work max_match=0 "(?i)(?=(?:[^\"]*\"[^\"]*\")*[^\"]*$)\bNOT\s+index\s*=\s*\"?(?<index_negative_not>[A-Za-z0-9_.*:\-]+)\"?"\
\
| rex field=index_work max_match=0 "(?i)(?=(?:[^\"]*\"[^\"]*\")*[^\"]*$)\bNOT\s+index\s*=\s*\x60(?<index_negative_not_macro>[A-Za-z0-9_-]+)(?:\([^\x60]*\))?\x60"\
\
| rex field=index_work max_match=0 "(?i)(?=(?:[^\"]*\"[^\"]*\")*[^\"]*$)\bindex\s*!=\s*\"?(?<index_negative_ne>[A-Za-z0-9_.*:\-]+)\"?"\
\
| rex field=index_work max_match=0 "(?i)(?=(?:[^\"]*\"[^\"]*\")*[^\"]*$)\bindex\s*!=\s*\x60(?<index_negative_ne_macro>[A-Za-z0-9_-]+)(?:\([^\x60]*\))?\x60"\
\
| rex field=index_work max_match=0 "(?i)(?=(?:[^\"]*\"[^\"]*\")*[^\"]*$)(?:\bNOT\s+index\s+IN|\bindex\s+NOT\s+IN)\s*\((?<index_negative_in_work>[^)]*)\)"\
\
| eval index_negative_in_work=mvjoin(\
    index_negative_in_work,\
    ","\
)\
\
| rex field=index_negative_in_work max_match=0 "(?:^|,)\s*\"?(?<index_negative_in>[A-Za-z0-9_.*:\-]+)\"?\s*(?=,|$)"\
\
| rex field=index_negative_in_work max_match=0 "(?:^|,)\s*\x60(?<index_negative_in_macro>[A-Za-z0-9_-]+)(?:\([^\x60]*\))?\x60\s*(?=,|$)"\
\
| eval excluded_indexes=mvdedup(\
    mvsort(\
        mvappend(\
            index_negative_group,\
            index_negative_not,\
            index_negative_ne,\
            index_negative_in\
        )\
    )\
)\
\
| eval excluded_index_macros=mvdedup(\
    mvsort(\
        mvappend(\
            index_negative_group_macro,\
            index_negative_not_macro,\
            index_negative_ne_macro,\
            index_negative_in_macro\
        )\
    )\
)\
\
| eval index_positive_work=index_work\
\
| eval index_positive_work=replace(\
    index_positive_work,\
    "(?i)(?=(?:[^\"]*\"[^\"]*\")*[^\"]*$)\bNOT\s*\([^()]*\)",\
    " "\
)\
\
| eval index_positive_work=replace(\
    index_positive_work,\
    "(?i)(?=(?:[^\"]*\"[^\"]*\")*[^\"]*$)(?:\bNOT\s+index\s+IN|\bindex\s+NOT\s+IN)\s*\([^)]*\)",\
    " "\
)\
\
| eval index_positive_work=replace(\
    index_positive_work,\
    "(?i)(?=(?:[^\"]*\"[^\"]*\")*[^\"]*$)\bNOT\s+index\s*=\s*(?:\"[^\"]*\"|\x60[^\x60]*\x60|[A-Za-z0-9_.*:\-]+)",\
    " "\
)\
\
| eval index_positive_work=replace(\
    index_positive_work,\
    "(?i)(?=(?:[^\"]*\"[^\"]*\")*[^\"]*$)\bindex\s*!=\s*(?:\"[^\"]*\"|\x60[^\x60]*\x60|[A-Za-z0-9_.*:\-]+)",\
    " "\
)\
\
| rex field=index_positive_work max_match=0 "(?i)(?=(?:[^\"]*\"[^\"]*\")*[^\"]*$)\bindex\s*=\s*\"?(?<index_positive_eq>[A-Za-z0-9_.*:\-]+)\"?"\
\
| rex field=index_positive_work max_match=0 "(?i)(?=(?:[^\"]*\"[^\"]*\")*[^\"]*$)\bindex\s*=\s*\x60(?<index_positive_eq_macro>[A-Za-z0-9_-]+)(?:\([^\x60]*\))?\x60"\
\
| rex field=index_positive_work max_match=0 "(?i)(?=(?:[^\"]*\"[^\"]*\")*[^\"]*$)\bindex\s+IN\s*\((?<index_positive_in_work>[^)]*)\)"\
\
| eval index_positive_in_work=mvjoin(\
    index_positive_in_work,\
    ","\
)\
\
| rex field=index_positive_in_work max_match=0 "(?:^|,)\s*\"?(?<index_positive_in>[A-Za-z0-9_.*:\-]+)\"?\s*(?=,|$)"\
\
| rex field=index_positive_in_work max_match=0 "(?:^|,)\s*\x60(?<index_positive_in_macro>[A-Za-z0-9_-]+)(?:\([^\x60]*\))?\x60\s*(?=,|$)"\
\
| rex field=index_positive_work max_match=0 "(?=(?:[^\"]*\"[^\"]*\")*[^\"]*$)\|\s*(?-i:from)\s+\"?(?!(?i:datamodel):)(?<index_positive_from>[A-Za-z0-9_.*:\-]+)\"?"\
\
| rex field=index_positive_work max_match=0 "(?=(?:[^\"]*\"[^\"]*\")*[^\"]*$)\|\s*(?-i:from)\s+\x60(?<index_positive_from_macro>[A-Za-z0-9_-]+)(?:\([^\x60]*\))?\x60"\
\
| eval referenced_indexes=mvdedup(\
    mvsort(\
        mvappend(\
            index_positive_eq,\
            index_positive_in,\
            index_positive_from\
        )\
    )\
)\
\
| eval referenced_index_macros=mvdedup(\
    mvsort(\
        mvappend(\
            index_positive_eq_macro,\
            index_positive_in_macro,\
            index_positive_from_macro\
        )\
    )\
)\
\
| eval referenced_indexes=mvjoin(\
    referenced_indexes,\
    printf("%c",10)\
)\
\
| eval referenced_index_macros=mvjoin(\
    referenced_index_macros,\
    printf("%c",10)\
)\
\
| eval excluded_indexes=mvjoin(\
    excluded_indexes,\
    printf("%c",10)\
)\
\
| eval excluded_index_macros=mvjoin(\
    excluded_index_macros,\
    printf("%c",10)\
)\
\
| fields -\
    index_work\
    index_positive_work\
    index_negative_group_work\
    index_negative_group\
    index_negative_group_macro\
    index_negative_not\
    index_negative_not_macro\
    index_negative_ne\
    index_negative_ne_macro\
    index_negative_in_work\
    index_negative_in\
    index_negative_in_macro\
    index_positive_eq\
    index_positive_eq_macro\
    index_positive_in_work\
    index_positive_in\
    index_positive_in_macro\
    index_positive_from\
    index_positive_from_macro
iseval = false

