[dsi_zip_search_pattern(1)]
args = field
definition = eval $field$ = referenced_index."###".referenced_sourcetype."###".app."###".provenance."###".savedsearch_name."###".search_lookback_category."###".search_lookback_category_shouldbe."###".command_list."###".first_command."###".daily_search_count."###".daily_search_count_shouldbe."###".interval."###".search_lookback_days."###".avg_run_time."###".avg_scan_count."###".avg_bucketcache_miss."###".avg_bucketcache_miss_ratio."###".problem."###".period_days
iseval = 0

[dsi_unzip_search_pattern(1)]
args = field
definition = rex field=$field$ "^(?<referenced_index>.*?)###(?<referenced_sourcetype>.*?)###(?<app>.*?)###(?<provenance>.*?)###(?<savedsearch_name>.*?)###(?<search_lookback_category>.*?)###(?<search_lookback_category_shouldbe>.*?)###(?<command_list>.*?)###(?<first_command>.*?)###(?<daily_search_count>.*?)###(?<daily_search_count_shouldbe>.*?)###(?<interval>.*?)###(?<search_lookback_days>.*?)###(?<avg_run_time>.*?)###(?<avg_scan_count>.*?)###(?<avg_bucketcache_miss>.*?)###(?<avg_bucketcache_miss_ratio>.*?)###(?<problem>.*?)###(?<period_days>.*)"
iseval = 0

[dsi_set_period_for_stats_by_audit_search_conservative]
definition = [ search index=_audit TERM(action=search) TERM(info=completed)\
    earliest=-7d@w latest=@d\
    NOT provenance IN (rest rest:jobs)\
| eval dow=strftime(_time,"%w")\
| where dow>=1 AND dow<=5\
| bin _time span=1d\
| stats count by _time\
| sort 0 - count\
| head 1\
| eval earliest=_time\
| eval latest=_time+86400\
| return earliest latest ]
iseval = 0
