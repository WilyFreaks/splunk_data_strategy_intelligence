    dsi_datamodel_work,\
    printf("%c",10)\
)\
\
| mvexpand dsi_datamodel_work\
\
| join type=left dsi_datamodel_work\
    [\
        | rest splunk_server=* /servicesNS/-/-/datamodel/model count=0\
\
        | rename title as dsi_datamodel_work\
\
        | spath input=description\
            output=dsi_datamodel_base_search\
            path=objects{}.baseSearch\
\
        | spath input=description\
            output=dsi_datamodel_constraint_search\
            path=objects{}.constraints{}.search\
\
        | eval dsi_datamodel_spl=mvappend(\
            dsi_datamodel_base_search,\
            dsi_datamodel_constraint_search\
        )\
\
        | eval dsi_datamodel_spl=mvfilter(\
            len(dsi_datamodel_spl)>0\
        )\
\
        | eval dsi_datamodel_spl=mvjoin(\
            dsi_datamodel_spl,\
            " "\
        )\
\
        | stats\
            last(dsi_datamodel_spl) as dsi_datamodel_spl\
          by dsi_datamodel_work\
    ]\
\
| `dsi_extract_referenced_indexes(dsi_datamodel_spl)`\
\
| `dsi_extract_referenced_sourcetypes(dsi_datamodel_spl)`\
