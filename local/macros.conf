| `dsi_resolve_referenced_object_macros(referenced_sourcetype_macros)`\
\
| `dsi_resolve_referenced_object_macros(excluded_index_macros)`\
\
| `dsi_resolve_referenced_object_macros(excluded_sourcetype_macros)`\
