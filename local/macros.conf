    values(referenced_sourcetypes) as dsi_referenced_sourcetypes_by_datamodel\
    values(excluded_indexes) as dsi_excluded_indexes_by_datamodel\
    values(excluded_sourcetypes) as dsi_excluded_sourcetypes_by_datamodel\
  by dsi_datamodel_event_id\
\
| dedup dsi_datamodel_event_id\
\
| eval referenced_indexes_by_datamodel=mvjoin(\
    mvdedup(\
        mvsort(\
            mvfilter(\
                len(dsi_referenced_indexes_by_datamodel)>0\
            )\
        )\
    ),\
    printf("%c",10)\
)\
\
| eval referenced_sourcetypes_by_datamodel=mvjoin(\
    mvdedup(\
        mvsort(\
            mvfilter(\
                len(dsi_referenced_sourcetypes_by_datamodel)>0\
