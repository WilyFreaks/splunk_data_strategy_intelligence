[dsi_extract_commands(1)]
args = field
definition = eval dsi_cmd_spl=coalesce($field$,"")\
| eval dsi_head=replace(dsi_cmd_spl,"(?s)^\s*(?:\x60{3}(?:[^\x60]++|\x60(?!\x60{2}))*+\x60{3}\s*)+","")\
| rex field=dsi_head "^\s*(?<dsi_first>[A-Za-z_][A-Za-z0-9_-]*)"\
| eval dsi_generators=split("search,tstats,mstats,from,inputlookup,inputcsv,makeresults,metadata,dbinspect,rest,datamodel,pivot,eventcount,gentimes,mcatalog,msearch,typeahead,walklex,loadjob,savedsearch",",")\
| eval dsi_start=case(\
    len(trim(dsi_head))=0,null(),\
    match(dsi_head,"^\s*\x7c\s*\x60(?!\x60)"),"search",\
    match(dsi_head,"^\s*\x7c"),null(),\
    isnotnull(mvfind(dsi_generators,"^".lower(dsi_first)."$")),lower(dsi_first),\
    true(),"search"\
  )\
| rex field=dsi_cmd_spl max_match=0 "(?s)\x60{3}(?:[^\x60]++|\x60(?!\x60{2}))*+\x60{3}(*SKIP)(*F)|\x22(?:[^\x22\x5c]++|\x5c.)*+\x22(*SKIP)(*F)|\x27(?:[^\x27\x5c]++|\x5c.)*+\x27(*SKIP)(*F)|\x60[^\x60]*+\x60(*SKIP)(*F)|(?<dsi_tokens>\[\s*\x60[^\x60]*+\x60|\[\s*[A-Za-z_][A-Za-z0-9_-]*|\[|\]|\x7c\s*[A-Za-z_][A-Za-z0-9_-]*)"\
| eval dsi_lines=coalesce(dsi_start,"")\
| eval dsi_depth=0, dsi_pos=0, command_depth_exceeded=0\
| eval dsi_tokens=mvappend(dsi_tokens,"__DSI_IGNORE__")\
| foreach mode=multivalue dsi_tokens [\
    eval dsi_token=mvindex(dsi_tokens,dsi_pos),\
         dsi_type=substr(dsi_token,1,1),\
         dsi_word=replace(substr(dsi_token,2),"^\s+|\s+$",""),\
         dsi_depth=case(\
             dsi_type="[",dsi_depth+1,\
             dsi_type="]",max(0,dsi_depth-1),\
             true(),dsi_depth\
         ),\
         command_depth_exceeded=if(\
             dsi_depth>3,1,command_depth_exceeded\
         ),\
         dsi_cmd=case(\
             dsi_type="|",lower(dsi_word),\
             dsi_type="[" AND len(dsi_word)>0,\
                 if(isnotnull(mvfind(dsi_generators,\
                     "^".lower(dsi_word)."$")),\
                    lower(dsi_word),"search"),\
             true(),null()\
         ),\
         dsi_level=min(dsi_depth,3),\
         dsi_formatted=if(\
             isnull(dsi_cmd),null(),\
             substr("[[[",1,dsi_level)\
             . dsi_cmd\
             . substr("]]]",1,dsi_level)\
         ),\
         dsi_lines=if(\
             isnull(dsi_formatted),dsi_lines,\
             dsi_lines\
             . if(len(dsi_lines)>0,printf("%c",10),"")\
             . dsi_formatted\
         ),\
         dsi_pos=dsi_pos+1\
]\
| eval command_list=if(len(dsi_lines)>0,dsi_lines,null())\
| eval first_command=replace(\
    mvindex(split(command_list,printf("%c",10)),0),\
    "^\[+|\]+$",""\
  )\
| fields - dsi_cmd_spl dsi_head dsi_first dsi_generators dsi_start dsi_tokens dsi_lines dsi_depth dsi_pos dsi_token dsi_type dsi_word dsi_cmd dsi_level dsi_formatted
iseval = 0

