[dsi_test_referenced_macro]
definition = (index=main OR index=security OR index=`dsi_test_referenced_index_macro_2`) AND NOT (index=_internal OR index=`dsi_test_referenced_index_macro_5`) AND (sourcetype=syslog OR sourcetype=access_combined OR sourcetype=`dsi_test_referenced_sourcetype_macro_2`) AND NOT (sourcetype=noisy OR sourcetype=`dsi_test_referenced_sourcetype_macro_5`)
iseval = false

[dsi_expand_reference(2)]
args = reference_field,additional_reference_field
definition = eval dsi_expand_reference_work=mvappend(\
    split($reference_field$, printf("%c",10)),\
    split($additional_reference_field$, printf("%c",10))\
)\
\
| eval dsi_expand_reference_work=mvfilter(\
    len(dsi_expand_reference_work)>0\
)\
\
| eval $reference_field$=coalesce(\
    mvjoin(\
        mvdedup(\
            mvsort(\
                dsi_expand_reference_work\
            )\
        ),\
        printf("%c",10)\
    ),\
    ""\
)\
\
| fields - dsi_expand_reference_work
iseval = false

[dsi_set_period_for_stats_by_audit_search]
definition = [ search index=_audit TERM(action=search) TERM(info=completed)\
    earliest=-7d@w latest=@d\
    NOT provenance IN (rest rest:jobs)\
| eval dow=strftime(_time,"%w")\
| where dow>=1 AND dow<=5\
| bin _time span=1d\
| stats count by _time\
| sort 0 - count\
| head 1\
| eval earliest=_time\
| eval latest=_time+86400\
| return earliest latest ]
iseval = false
