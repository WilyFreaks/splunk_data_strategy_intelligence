            output=dsi_datamodel_base_search\
            path=objects{}.baseSearch\
\
        | spath input=description\
            output=dsi_datamodel_constraint_search\
            path=objects{}.constraints{}.search\
\
        | eval dsi_datamodel_spl=mvappend(\
            dsi_datamodel_base_search,\
            dsi_datamodel_constraint_search\
        )\
\
        | eval dsi_datamodel_spl=mvfilter(\
            len(dsi_datamodel_spl)>0\
        )\
\
        | eval dsi_datamodel_spl=mvjoin(\
            dsi_datamodel_spl,\
            " "\
        )\
\
        | stats\
            last(dsi_datamodel_spl) as dsi_datamodel_spl\
          by dsi_datamodel_work\
    ]\
\
| `dsi_extract_referenced_indexes(dsi_datamodel_spl)`\
\
| `dsi_extract_referenced_sourcetypes(dsi_datamodel_spl)`\
\
| `dsi_resolve_referenced_object_macros(referenced_index_macros)`\
\
| `dsi_resolve_referenced_object_macros(referenced_sourcetype_macros)`\
\
| `dsi_resolve_referenced_object_macros(excluded_index_macros)`\
\
| `dsi_resolve_referenced_object_macros(excluded_sourcetype_macros)`\
\
| `dsi_expand_reference(referenced_indexes, referenced_index_macros_def)`\
\
| `dsi_expand_reference(referenced_sourcetypes, referenced_sourcetype_macros_def)`\
\
| `dsi_expand_reference(excluded_indexes, excluded_index_macros_def)`\
\
| `dsi_expand_reference(excluded_sourcetypes, excluded_sourcetype_macros_def)`\
\
| eval referenced_indexes=split(\
    referenced_indexes,\
    printf("%c",10)\
)\
\
| eval referenced_sourcetypes=split(\
    referenced_sourcetypes,\
    printf("%c",10)\
)\
\
| eval excluded_indexes=split(\
    excluded_indexes,\
    printf("%c",10)\
)\
\
| eval excluded_sourcetypes=split(\
    excluded_sourcetypes,\
    printf("%c",10)\
)\
\
| eventstats\
    values(referenced_indexes) as dsi_referenced_indexes_by_datamodel\
    values(referenced_sourcetypes) as dsi_referenced_sourcetypes_by_datamodel\
    values(excluded_indexes) as dsi_excluded_indexes_by_datamodel\
    values(excluded_sourcetypes) as dsi_excluded_sourcetypes_by_datamodel\
  by dsi_datamodel_event_id\
\
| dedup dsi_datamodel_event_id\
\
| eval referenced_indexes_by_datamodel=mvjoin(\
    mvdedup(\
        mvsort(\
            mvfilter(\
                len(dsi_referenced_indexes_by_datamodel)>0\
            )\
        )\
    ),\
    printf("%c",10)\
)\
\
| eval referenced_sourcetypes_by_datamodel=mvjoin(\
    mvdedup(\
        mvsort(\
            mvfilter(\
                len(dsi_referenced_sourcetypes_by_datamodel)>0\
            )\
        )\
    ),\
    printf("%c",10)\
)\
\
| eval excluded_indexes_by_datamodel=mvjoin(\
    mvdedup(\
        mvsort(\
            mvfilter(\
                len(dsi_excluded_indexes_by_datamodel)>0\
            )\
