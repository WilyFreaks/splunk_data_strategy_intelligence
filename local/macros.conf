[dsi_resolve_referenced_object_macros(1)]
args = field
definition = streamstats count as object_macro_event_id\
\
| eval object_macro_work=if(\
    isnull($field$) OR len(trim($field$))=0,\
    "__DSI_NO_OBJECT_MACRO__",\
    $field$\
)\
\
| eval object_macro_work=split(\
    object_macro_work,\
    printf("%c",10)\
)\
\
| mvexpand object_macro_work\
\
| join type=left object_macro_work\
    [\
        | rest /servicesNS/-/-/admin/macros splunk_server=* count=0\
\
        | rename title as object_macro_work\
\
        | eval object_macro_definition=trim(definition)\
\
        | eval object_macro_definition_valid=case(\
            match(\
                "$field$",\
                "(^|_)index_macros(?:_|$)"\
            ),\
                if(\
                    match(\
                        object_macro_definition,\
                        "^[A-Za-z0-9_][A-Za-z0-9_-]*(?:\s*(?:,|(?i:OR))\s*[A-Za-z0-9_][A-Za-z0-9_-]*)*$"\
                    ),\
                    1,\
                    0\
                ),\
\
            match(\
                "$field$",\
                "(^|_)sourcetype_macros(?:_|$)"\
            ),\
                if(\
                    match(\
                        object_macro_definition,\
                        "^[A-Za-z0-9_][A-Za-z0-9_.:-]*(?:\s*(?:,|(?i:OR))\s*[A-Za-z0-9_][A-Za-z0-9_.:-]*)*$"\
                    ),\
                    1,\
                    0\
                ),\
\
            match(\
                "$field$",\
                "(^|_)eventtype_macros(?:_|$)"\
            ),\
                if(\
                    match(\
                        object_macro_definition,\
                        "^[A-Za-z0-9_][A-Za-z0-9_.:-]*(?:\s*(?:,|(?i:OR))\s*[A-Za-z0-9_][A-Za-z0-9_.:-]*)*$"\
                    ),\
                    1,\
                    0\
                ),\
\
            match(\
                "$field$",\
                "(^|_)datamodel_macros(?:_|$)"\
            ),\
                if(\
                    match(\
                        object_macro_definition,\
                        "^[A-Za-z0-9_][A-Za-z0-9_-]*(?:\s*(?:,|(?i:OR))\s*[A-Za-z0-9_][A-Za-z0-9_-]*)*$"\
                    ),\
                    1,\
                    0\
                ),\
\
            true(),\
                0\
        )\
\
        | where object_macro_definition_valid=1\
\
        | eval object_macro_definition=replace(\
            object_macro_definition,\
            "(?i)\s+OR\s+",\
            ","\
        )\
\
        | eval object_macro_definition=replace(\
            object_macro_definition,\
            "\s*,\s*",\
            ","\
        )\
\
        | eval object_macro_definition=split(\
            object_macro_definition,\
            ","\
        )\
\
        | eval object_macro_definition=mvmap(\
            object_macro_definition,\
            trim(object_macro_definition)\
        )\
\
        | eval object_macro_definition=mvfilter(\
            len(object_macro_definition)>0\
        )\
\
        | eval object_macro_definition=mvdedup(\
            mvsort(\
                object_macro_definition\
            )\
        )\
\
        | fields\
            object_macro_work\
            object_macro_definition\
    ]\
\
| eval object_macro_definition=split(\
    object_macro_definition,\
    printf("%c",10)\
)\
\
| eval object_macro_definition=mvmap(\
    object_macro_definition,\
    trim(object_macro_definition)\
)\
\
| eval object_macro_definition=mvfilter(\
    len(object_macro_definition)>0\
)\
\
| eval object_macro_reference=if(\
    object_macro_work="__DSI_NO_OBJECT_MACRO__",\
    null(),\
    object_macro_work\
)\
\
| eval object_macro_definition=mvappend(\
    $field$_def,\
    object_macro_definition\
)\
\
| eventstats\
    values(object_macro_reference) as object_macro_references\
    values(object_macro_definition) as object_macro_definitions\
  by object_macro_event_id\
\
| dedup object_macro_event_id\
\
| eval $field$=mvdedup(\
    mvsort(\
        object_macro_references\
    )\
)\
\
| eval $field$_def=mvdedup(\
    mvsort(\
        object_macro_definitions\
    )\
)\
\
| eval $field$=mvjoin(\
    $field$,\
    printf("%c",10)\
)\
\
| eval $field$_def=mvjoin(\
    $field$_def,\
    printf("%c",10)\
)\
\
| fields -\
    object_macro_event_id\
    object_macro_work\
    object_macro_reference\
    object_macro_references\
    object_macro_definition\
    object_macro_definitions
iseval = false

